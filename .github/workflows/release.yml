name: release

# PyPI Trusted Publishing setup (one time):
# 1. Create `testpypi` and `pypi` GitHub environments.
# 2. Register this repository and release.yml as a trusted publisher on each index.
# A new version merged to main publishes automatically. A v* tag or manual run can retry it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect unpublished version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check PyPI
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}" || {
              echo "Tag $GITHUB_REF_NAME does not match pyproject version v${{ steps.version.outputs.version }}"
              exit 1
            }
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl --retry 3 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/misapp/${{ steps.version.outputs.version }}/json")
          if [[ "$status" == "404" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version status on PyPI: HTTP $status; publishing skipped."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build platform wheel
        run: |
          python -m pip install "ziglang>=0.13,<0.14" "scikit-build-core>=1.0" build
          python -m build --wheel --no-isolation
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import subprocess; subprocess.run(['misapp', '--help'], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source distribution
        run: |
          python -m pip install "ziglang>=0.13,<0.14" "scikit-build-core>=1.0" build twine
          python -m build --sdist --no-isolation
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [detect, wheels, sdist]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/misapp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [detect, publish-testpypi]
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/misapp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  tag-release:
    name: Tag and GitHub Release
    needs: [detect, publish-pypi]
    if: needs.detect.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release record
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
